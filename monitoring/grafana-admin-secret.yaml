# Admin-учётка Grafana. Ссылка на неё — grafana.admin.existingSecret в
# prometheus-values.yaml: пароль не попадает ни в values, ни в историю Helm.
# Secret'ы не ходят между namespace, поэтому он создаётся в monitoring и
# ДО установки чарта. Учебный пароль — в production смените/вынесите из Git.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-secret
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  admin-user: admin
  admin-password: admin

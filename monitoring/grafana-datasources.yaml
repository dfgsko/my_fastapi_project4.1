# Источник данных Loki для Grafana. Sidecar Grafana (label grafana_datasource)
# подхватывает ConfigMap сам — перезапускать Grafana не нужно.
# Prometheus уже добавлен чартом kube-prometheus-stack (uid: prometheus).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-loki
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  # Имя файла уникально: у чарта есть собственный datasource.yaml.
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki-gateway.monitoring.svc.cluster.local
        isDefault: false
        editable: false
        jsonData:
          maxLines: 1000
          timeout: 60

# Prometheus для Docker Compose (профиль monitoring): тот же набор целей,
# что в Kubernetes обнаруживают ServiceMonitor'ы.
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: fastapi
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: flower
    metrics_path: /metrics
    static_configs:
      - targets: ["flower:5555"]

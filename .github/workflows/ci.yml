name: CI — tests, chart lint, security scan, build & push images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/fastapi-app
  IMAGE_WORKER: ghcr.io/${{ github.repository_owner }}/fastapi-worker

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  # Лаб. № 6: фронтенд (Vue 3 + Vite). Линтеры, форматирование, Vitest, сборка.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"          # create-vue требует Node ^22.18 или ≥ 24.12
          cache: npm
          cache-dependency-path: frontend-app/package-lock.json
      - run: npm ci
      - run: npm run lint:check
      - run: npm run format:check
      - run: npm run test:run       # «живой» тест против бэкенда пропускается без LIVE_API
      - run: npm run build

  chart-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - name: helm lint (dev и prod значения)
        run: |
          helm lint helm/fastapi-platform -f helm/fastapi-platform/values-dev.yaml
          helm lint helm/fastapi-platform -f helm/fastapi-platform/values-prod.yaml
          helm lint helm/postgres-cluster
      - name: helm template (все окружения должны рендериться)
        run: |
          for env in dev staging prod; do
            helm template fastapi-$env helm/fastapi-platform \
              -f helm/fastapi-platform/values.yaml \
              -f environments/$env/values.yaml > /dev/null
          done
      - name: NetworkPolicy сгенерированы из Helm-шаблона (нет расхождений)
        run: ./scripts/gen-network-policies.sh --check
      - name: helm template без SeaweedFS и мониторинга (кластер без их CRD)
        run: |
          helm template fastapi-min helm/fastapi-platform \
            --set seaweedfs.enabled=false --set observability.enabled=false > /dev/null

  # Лаб. № 4: конфигурация наблюдаемости и S3 проверяется без кластера.
  observability-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - run: pip install pyyaml
      - name: kustomize build (дашборды, datasource, secret Grafana)
        run: kubectl kustomize monitoring/ > /tmp/monitoring.yaml
      - name: kubeconform (k8s-манифесты, ServiceMonitor, рендер Helm)
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          helm template fastapi-dev helm/fastapi-platform -f environments/dev/values.yaml > /tmp/render.yaml
          ./kubeconform -strict -summary -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            k8s /tmp/monitoring.yaml /tmp/render.yaml
      - name: Синтаксис конфигурации Alloy (alloy validate)
        run: |
          python - <<'PY'
          import yaml
          cfg = yaml.safe_load(open("monitoring/alloy-values.yaml"))
          open("/tmp/config.alloy", "w").write(cfg["alloy"]["configMap"]["content"] + "\n")
          PY
          docker run --rm -v /tmp/config.alloy:/config.alloy grafana/alloy:v1.20.1 validate /config.alloy
      - name: Дашборды совпадают с генератором
        run: |
          python scripts/gen_dashboards.py
          git diff --exit-code monitoring/grafana-dashboards

  # Лаб. № 5: сканирование на уязвимости и мисконфигурации. Все действия
  # закреплены по SHA коммита (не по тегу): тег можно переписать, SHA — нет,
  # это защита от компрометации цепочки поставок (supply chain).
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Trivy — уязвимости зависимостей и секреты в репозитории
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Trivy — мисконфигурации Kubernetes/Helm (отчёт)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '0'      # информативно: часть находок — осознанные исключения (RabbitMQ, dev-Vault)

  build-and-push:
    needs: [test, chart-lint, security-scan]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Теги: sha (каждый коммит) и semver (при git tag v1.2.3 → 1.2.3 и v1.2.3).
      # Именно semver-теги отслеживает Argo CD Image Updater.
      - id: meta-api
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=sha
            type=semver,pattern=v{{version}}
      # Сначала собираем образ локально и сканируем: CRITICAL/HIGH с доступным
      # исправлением блокируют пайплайн — уязвимый образ не попадёт в реестр.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.api
          load: true
          tags: scan-api:${{ github.sha }}
          cache-from: type=gha,scope=api
      - name: Trivy — образ api
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - id: meta-worker
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_WORKER }}
          tags: |
            type=sha
            type=semver,pattern=v{{version}}
      # Сначала собираем образ локально и сканируем: CRITICAL/HIGH с доступным
      # исправлением блокируют пайплайн — уязвимый образ не попадёт в реестр.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.worker
          load: true
          tags: scan-worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
      - name: Trivy — образ worker
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan-worker:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.worker
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  # Деплоя здесь нет намеренно: кластером занимается Argo CD (pull-модель).
  # CI только публикует образы; Image Updater коммитит новый тег в Git,
  # Argo CD синхронизирует кластер. Kubeconfig в CI не нужен.

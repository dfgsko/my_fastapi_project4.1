# Flower — веб-интерфейс и экспортёр метрик Celery (flower_* на /metrics).
# Читает события воркеров из RabbitMQ (воркеры шлют их, см.
# worker_send_task_events в app/celery_app.py).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flower
  namespace: fastapi-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flower
  template:
    metadata:
      labels:
        app: flower
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flower
          image: mher/flower:2.0
          # $(VAR) раскрывает Kubernetes из env ниже (учётные данные — из Secret).
          args:
            - celery
            - --broker=amqp://$(RABBITMQ_DEFAULT_USER):$(RABBITMQ_DEFAULT_PASS)@$(RABBITMQ_HOST):5672//
            - flower
            - --port=5555
          envFrom:
            - configMapRef: {name: app-config}
            - secretRef: {name: app-secrets}
          ports:
            - name: http
              containerPort: 5555
          readinessProbe:
            httpGet: {path: /healthcheck, port: 5555}
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: data, mountPath: /data}
          resources:
            requests: {memory: 128Mi, cpu: 50m}
            limits: {memory: 256Mi, cpu: 300m}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
        - name: data
          emptyDir: {sizeLimit: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: flower
  namespace: fastapi-app
  labels:
    app: flower
spec:
  selector:
    app: flower
  ports:
    - name: http
      port: 5555
      targetPort: 5555
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flower-monitor
  namespace: fastapi-app
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: flower
  endpoints:
    - port: http
      path: /metrics
      interval: 15s

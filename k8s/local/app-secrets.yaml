# Secret app-secrets для кластера БЕЗ Vault (локальная разработка).
# Не применяется командой `kubectl apply -f k8s/` (лежит в подкаталоге).
#
#   kubectl apply -f k8s/local/app-secrets.yaml
#
# С Vault этот файл НЕ нужен: Secret заполняет Vault Secrets Operator
# (k8s/vault/), а совместное использование приведёт к конфликту записи.
# Значения учебные; SECRET_KEY должен быть случайным и ≥ 32 символов:
#   openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: fastapi-app
type: Opaque
stringData:
  SECRET_KEY: "local-dev-secret-key-change-me-0123456789abcdef0123"
  DATABASE_USER: "appuser"
  DATABASE_PASSWORD: "securePassword123"
  RABBITMQ_DEFAULT_USER: "guest"
  RABBITMQ_DEFAULT_PASS: "guest"

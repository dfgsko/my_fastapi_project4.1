# RabbitMQ — брокер сообщений Celery. Длину очереди "celery" читает KEDA.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: fastapi-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef: {name: app-secrets, key: RABBITMQ_DEFAULT_USER}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: {name: app-secrets, key: RABBITMQ_DEFAULT_PASS}
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests: {memory: 256Mi, cpu: 100m}
            limits: {memory: 512Mi, cpu: 500m}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: fastapi-app
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672

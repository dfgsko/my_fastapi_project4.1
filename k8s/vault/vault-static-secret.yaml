# Vault (kv-v2, secret/fastapi/config) → Kubernetes Secret app-secrets.
# Приложение, PostgreSQL и RabbitMQ читают его как обычный Secret, но пароли
# не лежат в Git: они живут только в Vault и в etcd кластера.
#
# Важно: Secret app-secrets не должен создаваться вручную (k8s/02-secrets.yaml
# его больше не содержит) — иначе kubectl apply и VSO перезаписывали бы
# значения друг друга.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: app-secrets
  namespace: fastapi-app
spec:
  vaultAuthRef: vault-auth
  mount: secret
  type: kv-v2
  path: fastapi/config
  refreshAfter: 30s               # VSO перечитывает Vault каждые 30 секунд
  destination:
    name: app-secrets
    create: true
    overwrite: true
  # Переменные окружения читаются только при старте пода: при смене секрета
  # VSO сам перезапускает API и воркеры (rolling restart).
  rolloutRestartTargets:
    - kind: Deployment
      name: fastapi
    - kind: Deployment
      name: celery-worker

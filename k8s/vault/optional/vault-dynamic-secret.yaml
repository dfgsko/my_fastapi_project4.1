# ОПЦИОНАЛЬНО: динамические учётные данные PostgreSQL. Vault сам создаёт роль
# в БД с коротким TTL и отзывает её по истечении — «вечного» пароля нет.
#
# Требует настройки в Vault (выполняется один раз):
#   vault secrets enable database
#   vault write database/config/appdb plugin_name=postgresql-database-plugin \
#     allowed_roles=fastapi-db-role \
#     connection_url="postgresql://{{username}}:{{password}}@postgres.fastapi-app.svc:5432/appdb?sslmode=disable" \
#     username=appuser password=<пароль-администратора-БД>
#   vault write database/roles/fastapi-db-role db_name=appdb default_ttl=1h max_ttl=24h \
#     creation_statements="CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}'; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO \"{{name}}\"; GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO \"{{name}}\";"
#   (и добавить в политику fastapi-policy: path "database/creds/fastapi-db-role" { capabilities = ["read"] })
#
# Ограничение: приложение читает DATABASE_USER / DATABASE_PASSWORD, поэтому
# Secret должен содержать эти ключи — это делает transformation ниже. Vault
# подключается к PostgreSQL из namespace vault: NetworkPolicy это разрешает.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: fastapi-db-creds
  namespace: fastapi-app
spec:
  vaultAuthRef: vault-auth
  mount: database
  path: creds/fastapi-db-role
  renewalPercent: 67             # продлевать, когда прошло 67 % срока жизни
  destination:
    name: app-db-creds
    create: true
    transformation:
      excludeRaw: true
      templates:
        DATABASE_USER:
          text: "{{ .Secrets.username }}"
        DATABASE_PASSWORD:
          text: "{{ .Secrets.password }}"
  rolloutRestartTargets:
    - kind: Deployment
      name: fastapi

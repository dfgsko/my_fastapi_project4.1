# Мост Kubernetes ↔ Vault (лаб. № 5). Vault Secrets Operator (VSO) логинится в
# Vault токеном этого ServiceAccount, Vault проверяет его через TokenReview и
# выдаёт доступ по роли fastapi-role (scripts/vault-setup.sh).
#
#   helm repo add hashicorp https://helm.releases.hashicorp.com && helm repo update
#   helm install vault hashicorp/vault -n vault --create-namespace -f security/vault-values.yaml
#   helm install vault-secrets-operator hashicorp/vault-secrets-operator \
#     -n vault-secrets-operator-system --create-namespace
#   ./scripts/vault-setup.sh          # метод kubernetes, политика, роль, секреты
#   kubectl apply -f k8s/vault/
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fastapi-sa
  namespace: fastapi-app
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault-connection
  namespace: fastapi-app
spec:
  address: http://vault.vault.svc.cluster.local:8200
  # Учебный Vault в dev-режиме работает по HTTP. В production — TLS и caCertSecretRef.
  skipTLSVerify: true
  timeout: 10s
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-auth
  namespace: fastapi-app
spec:
  vaultConnectionRef: vault-connection
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: fastapi-role
    serviceAccount: fastapi-sa
    audiences: [vault]            # то же значение в audience роли Vault

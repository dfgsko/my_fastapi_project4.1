# ВНИМАНИЕ: пароли ниже — учебные. Secret хранится в etcd в base64
# (это кодирование, а не шифрование).
#
# Лаб. № 5: Secret `app-secrets` (SECRET_KEY, DATABASE_*, RABBITMQ_*) БОЛЬШЕ НЕ
# создаётся вручную — его наполняет Vault Secrets Operator из HashiCorp Vault
# (k8s/vault/vault-static-secret.yaml). Хранить его здесь нельзя: kubectl apply
# и VSO бы бесконечно перезаписывали значения друг друга. Если Vault в кластере
# нет — используйте k8s/local/app-secrets.yaml (только для разработки).
#
# Здесь остаются секреты, которые Vault не ведёт: bootstrap-администратор и
# ключи S3 (их читают и оператор SeaweedFS, и приложение).
apiVersion: v1
kind: Secret
metadata:
  name: app-bootstrap-secrets
  namespace: fastapi-app
type: Opaque
stringData:
  # Первый администратор создаётся при старте API и Job-ом db-migrate.
  # Пароль обязан пройти политику (≥ 10 символов, буквы и цифры). После
  # первого входа смените его: POST /auth/change-password.
  ADMIN_BOOTSTRAP_USERNAME: "admin"
  ADMIN_BOOTSTRAP_PASSWORD: "ChangeMe-Admin-2026"
---
# Ключи доступа к S3 (SeaweedFS). Должны совпадать с identities в Secret
# seaweedfs-s3-config (k8s/seaweedfs/s3-credentials.yaml): сервер S3 читает
# их оттуда, приложение — отсюда. Два набора — принцип наименьших привилегий:
# admin пишет/удаляет, reader только читает и скачивает.
apiVersion: v1
kind: Secret
metadata:
  name: app-s3-secrets
  namespace: fastapi-app
type: Opaque
stringData:
  S3_ACCESS_KEY: "app-admin-key"
  S3_SECRET_KEY: "app-admin-secret-change-me"
  S3_READ_ACCESS_KEY: "app-reader-key"
  S3_READ_SECRET_KEY: "app-reader-secret-change-me"

# Учётные записи S3 для SeaweedFS (учебные значения!).
#
# В актуальной версии оператора SeaweedFS Secret с ключами НЕ создаётся
# автоматически: identities задаются JSON-файлом в Secret, на который
# ссылается spec.s3.configSecret (см. seaweedfs-cluster.yaml). Формат файла —
# стандартный s3.json самого SeaweedFS.
#
#   admin  — Admin/Read/Write/List/Tagging: загрузка и удаление (API, воркер);
#   reader — Read/List: скачивание и presigned URL.
#
# Значения должны совпадать с Secret app-s3-secrets (k8s/02-secrets.yaml).
# В production: Sealed Secrets / External Secrets, ключи не хранить в Git.
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3-config
  namespace: fastapi-app
type: Opaque
stringData:
  s3.json: |
    {
      "identities": [
        {
          "name": "admin",
          "credentials": [
            {"accessKey": "app-admin-key", "secretKey": "app-admin-secret-change-me"}
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        },
        {
          "name": "reader",
          "credentials": [
            {"accessKey": "app-reader-key", "secretKey": "app-reader-secret-change-me"}
          ],
          "actions": ["Read", "List"]
        }
      ]
    }

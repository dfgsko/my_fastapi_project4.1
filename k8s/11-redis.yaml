# Redis: кэш и rate limiting приложения + backend результатов Celery.
# Критичных данных не хранит, поэтому обычный Deployment без PVC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: fastapi-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Рабочий каталог образа — /data (там Redis пишет dump.rdb).
          volumeMounts:
            - {name: data, mountPath: /data}
          resources:
            requests: {memory: 64Mi, cpu: 50m}
            limits: {memory: 128Mi, cpu: 250m}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: fastapi-app
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379

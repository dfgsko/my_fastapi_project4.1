# Redis: кэш и rate limiting приложения + backend результатов Celery.
# Критичных данных не хранит, поэтому обычный Deployment без PVC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: fastapi-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {memory: 64Mi, cpu: 50m}
            limits: {memory: 128Mi, cpu: 250m}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: fastapi-app
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379

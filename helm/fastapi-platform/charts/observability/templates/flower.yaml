{{- if .Values.flower.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "observability.flowerName" . }}
  labels:
    {{- include "observability.labels" . | nindent 4 }}
    app: flower
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flower
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flower
        app.kubernetes.io/instance: {{ .Release.Name }}
        app: flower
    spec:
      containers:
        - name: flower
          image: {{ .Values.flower.image | quote }}
          args: ["celery", "flower", "--port=5555"]
          env:
            # Flower сам читает брокер из CELERY_BROKER_URL (Secret umbrella-чарта).
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "observability.secretName" . }}
                  key: RABBITMQ_URL
          ports:
            - name: http
              containerPort: 5555
          readinessProbe:
            httpGet: {path: /healthcheck, port: 5555}
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            {{- toYaml .Values.flower.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "observability.flowerName" . }}
  labels:
    {{- include "observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: flower
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app.kubernetes.io/name: flower
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 5555
      targetPort: 5555
{{- if .Values.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "observability.flowerName" . }}
  labels:
    {{- include "observability.labels" . | nindent 4 }}
    release: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: flower
      app.kubernetes.io/instance: {{ .Release.Name }}
  namespaceSelector:
    matchNames: [{{ .Release.Namespace }}]
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
{{- end }}

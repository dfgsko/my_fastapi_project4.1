{{- if .Values.serviceMonitor.enabled }}
# Требует CRD kube-prometheus-stack (monitoring/prometheus-values.yaml).
# Prometheus находит Service API по меткам subchart fastapi-api.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "observability.labels" . | nindent 4 }}
    release: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fastapi-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  namespaceSelector:
    matchNames: [{{ .Release.Namespace }}]
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}

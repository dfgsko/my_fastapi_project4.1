apiVersion: seaweed.seaweedfs.com/v1
kind: Seaweed
metadata:
  name: {{ .Values.clusterName }}
  labels:
    {{- include "seaweedfs.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  image: {{ .Values.image | quote }}
  volumeServerDiskCount: 1
  master:
    replicas: {{ .Values.master.replicas }}
    podSecurityContext: {{- include "seaweedfs.podSecurityContext" . | nindent 6 }}
    containerSecurityContext: {{- include "seaweedfs.containerSecurityContext" . | nindent 6 }}
    volumeSizeLimitMB: 1024
    {{- with .Values.master.resources }}
    requests: {{ toJson .requests }}
    limits: {{ toJson .limits }}
    {{- end }}
  volume:
    replicas: {{ .Values.volume.replicas }}
    podSecurityContext: {{- include "seaweedfs.podSecurityContext" . | nindent 6 }}
    containerSecurityContext: {{- include "seaweedfs.containerSecurityContext" . | nindent 6 }}
    requests:
      storage: {{ .Values.volume.storage }}
      cpu: {{ .Values.volume.resources.requests.cpu | quote }}
      memory: {{ .Values.volume.resources.requests.memory | quote }}
    limits: {{ toJson .Values.volume.resources.limits }}
  filer:
    replicas: {{ .Values.filer.replicas }}
    podSecurityContext: {{- include "seaweedfs.podSecurityContext" . | nindent 6 }}
    containerSecurityContext: {{- include "seaweedfs.containerSecurityContext" . | nindent 6 }}
    config: |
      [leveldb2]
      enabled = true
      dir = "/data/filerldb2"
    persistence:
      enabled: true
      mountPath: /data
      resources:
        requests:
          storage: {{ .Values.filer.storage }}
    requests: {{ toJson .Values.filer.resources.requests }}
    limits: {{ toJson .Values.filer.resources.limits }}
  s3:
    replicas: {{ .Values.s3.replicas }}
    podSecurityContext: {{- include "seaweedfs.podSecurityContext" . | nindent 6 }}
    containerSecurityContext: {{- include "seaweedfs.containerSecurityContext" . | nindent 6 }}
    configSecret:
      name: seaweedfs-s3-config
      key: s3.json
    requests: {{ toJson .Values.s3.resources.requests }}
    limits: {{ toJson .Values.s3.resources.limits }}

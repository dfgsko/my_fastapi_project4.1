{{- /*
  Identities S3 для SeaweedFS (формат s3.json). Значения берутся из global.s3 —
  тех же, что попадают в Secret приложения (templates/secrets.yaml umbrella-чарта),
  поэтому ключи сервера и клиента не могут разойтись.
*/ -}}
{{- $s3 := .Values.global.s3 }}
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3-config
  labels:
    {{- include "seaweedfs.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  s3.json: |
    {{- dict "identities" (list
          (dict "name" "admin"
                "credentials" (list (dict "accessKey" $s3.accessKey "secretKey" $s3.secretKey))
                "actions" (list "Admin" "Read" "Write" "List" "Tagging"))
          (dict "name" "reader"
                "credentials" (list (dict "accessKey" $s3.readAccessKey "secretKey" $s3.readSecretKey))
                "actions" (list "Read" "List"))) | toPrettyJson | nindent 4 }}

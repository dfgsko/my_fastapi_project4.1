apiVersion: v1
kind: Service
metadata:
  name: {{ include "fastapi-api.fullname" . }}
  labels:
    {{- include "fastapi-api.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: ClusterIP
  selector:
    {{- include "fastapi-api.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}

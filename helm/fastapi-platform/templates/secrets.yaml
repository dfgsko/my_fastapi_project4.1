{{- if not .Values.global.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    {{- include "fastapi-platform.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  DATABASE_USER: {{ .Values.global.database.user | quote }}
  DATABASE_PASSWORD: {{ .Values.global.database.password | quote }}
  RABBITMQ_DEFAULT_USER: {{ .Values.global.rabbitmq.user | quote }}
  RABBITMQ_DEFAULT_PASS: {{ .Values.global.rabbitmq.password | quote }}
  # Нужен KEDA (TriggerAuthentication читает отсюда параметр host).
  RABBITMQ_URL: {{ printf "amqp://%s:%s@%s:5672//" .Values.global.rabbitmq.user .Values.global.rabbitmq.password (include "fastapi-platform.rabbitHost" .) | quote }}
  S3_ACCESS_KEY: {{ .Values.global.s3.accessKey | quote }}
  S3_SECRET_KEY: {{ .Values.global.s3.secretKey | quote }}
  S3_READ_ACCESS_KEY: {{ .Values.global.s3.readAccessKey | quote }}
  S3_READ_SECRET_KEY: {{ .Values.global.s3.readSecretKey | quote }}
{{- end }}

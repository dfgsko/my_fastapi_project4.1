{{- $env := .Values.global.environment }}
{{- $strict := has $env (list "staging" "prod" "production") }}
{{- if and (not .Values.global.existingSecret) (not .Values.vault.enabled) }}
{{- if and $strict (not .Values.global.jwt.secretKey) }}
{{- fail (printf "global.jwt.secretKey обязателен для environment=%s: задайте его через Vault (vault.enabled), existingSecret или values (не в Git)" $env) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    {{- include "fastapi-platform.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  # Ключ подписи JWT (лаб. № 5). В dev допустимо учебное значение.
  SECRET_KEY: {{ default "dev-only-secret-key-change-me-0123456789abcdef0123" .Values.global.jwt.secretKey | quote }}
  DATABASE_USER: {{ .Values.global.database.user | quote }}
  DATABASE_PASSWORD: {{ .Values.global.database.password | quote }}
  RABBITMQ_DEFAULT_USER: {{ .Values.global.rabbitmq.user | quote }}
  RABBITMQ_DEFAULT_PASS: {{ .Values.global.rabbitmq.password | quote }}
  # Нужен KEDA (TriggerAuthentication читает отсюда параметр host).
  RABBITMQ_URL: {{ printf "amqp://%s:%s@%s:5672//" .Values.global.rabbitmq.user .Values.global.rabbitmq.password (include "fastapi-platform.rabbitHost" .) | quote }}
  S3_ACCESS_KEY: {{ .Values.global.s3.accessKey | quote }}
  S3_SECRET_KEY: {{ .Values.global.s3.secretKey | quote }}
  S3_READ_ACCESS_KEY: {{ .Values.global.s3.readAccessKey | quote }}
  S3_READ_SECRET_KEY: {{ .Values.global.s3.readSecretKey | quote }}
{{- end }}
---
{{- if not .Values.global.bootstrap.existingSecret }}
# Bootstrap-администратор: не управляется Vault (см. ЛР5, приложение А).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-bootstrap
  labels:
    {{- include "fastapi-platform.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  ADMIN_BOOTSTRAP_USERNAME: {{ .Values.global.bootstrap.username | quote }}
  ADMIN_BOOTSTRAP_PASSWORD: {{ .Values.global.bootstrap.password | quote }}
{{- end }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    {{- include "fastapi-platform.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  DATABASE_HOST: {{ include "fastapi-platform.dbHost" . | quote }}
  DATABASE_NAME: {{ .Values.global.database.name | quote }}
  REDIS_HOST: {{ include "fastapi-platform.redisHost" . | quote }}
  RABBITMQ_HOST: {{ include "fastapi-platform.rabbitHost" . | quote }}
  AUTO_CREATE_TABLES: "false"
  CERTIFICATES_DIR: "/app/certificates"
  ENVIRONMENT: {{ .Values.global.environment | quote }}
  # --- Безопасность (лаб. № 5) ---
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  BCRYPT_ROUNDS: "12"
  PASSWORD_MIN_LENGTH: "12"
  AUTH_RATE_LIMIT_MAX: "10"
  AUTH_RATE_LIMIT_WINDOW: "60"
  TRUSTED_HOSTS: {{ default (printf "%s,%s-api,%s-api.%s.svc.cluster.local,localhost" (index .Values "fastapi-api" "ingress" "host") .Release.Name .Release.Name .Release.Namespace) .Values.global.security.trustedHosts | quote }}
  CORS_ORIGINS: {{ .Values.global.security.corsOrigins | quote }}
  SECURE_HEADERS_ENABLED: "true"
  METRICS_BLOCK_PROXIED: "true"
  DOCS_ENABLED: {{ .Values.global.security.docsEnabled | quote }}
  # --- Аккаунты, 2FA, cookie-сессии, email, возраст (лаб. № 8) ---
  # Secure-cookie: в production включается автоматически (ENVIRONMENT).
  COOKIE_SAMESITE: "strict"
  TOTP_ISSUER: "Educational Platform"
  FRONTEND_URL: {{ printf "https://%s" (index .Values "fastapi-api" "ingress" "host") | quote }}
  EMAIL_VERIFICATION_REQUIRED: "true"
  SMTP_HOST: {{ .Values.global.smtp.host | quote }}
  SMTP_PORT: {{ .Values.global.smtp.port | quote }}
  SMTP_FROM: {{ .Values.global.smtp.from | quote }}
  AGE_VERIFICATION_ENABLED: "true"
  AGE_VERIFICATION_ON_REGISTRATION: "true"
  AGE_MINIMUM: "18"
  AGE_MIN_CONFIDENCE: "0.7"
  # mock — демо-оценщик; betterageverify требует образ с torch и весами моделей.
  AGE_ESTIMATOR_BACKEND: {{ .Values.global.ageVerification.backend | quote }}
  # --- S3 (SeaweedFS) ---
  S3_ENDPOINT: {{ default "http://seaweedfs-s3:8333" .Values.global.s3.endpoint | quote }}
  S3_BUCKET: {{ .Values.global.s3.bucket | quote }}
  S3_REGION: {{ .Values.global.s3.region | quote }}
  S3_UPLOAD_CERTIFICATES: {{ .Values.seaweedfs.enabled | quote }}
